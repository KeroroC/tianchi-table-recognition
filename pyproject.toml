[project]
name = "tianchi-table-recognition"
version = "0.1.0"
description = "Automated multimodal table recognition and QA pipeline for Tianchi 532510"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
]

[project.scripts]
ttr = "tianchi_table_recognition.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tianchi_table_recognition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
